[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[rpc_endpoints]
# Set RPC_ROBINHOOD in contracts/.env. https://robinhood-rpc.publicnode.com works where the
# public endpoint is intercepted.
robinhood = "${RPC_ROBINHOOD}"
